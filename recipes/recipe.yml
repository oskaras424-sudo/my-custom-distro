---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: my-custom-distro
description: "A custom gaming-focused Linux distribution built on Bazzite."

base-image: ghcr.io/ublue-os/bazzite-nvidia-open
image-version: stable

modules:
  # Add our own artwork, launchers, theme and custom applications.
  - type: files
    files:
      - source: system
        destination: /

  # Python runtime libraries required by our custom desktop applications.
  - type: dnf
    install:
      packages:
        - python3-pyside6
        - python3-psutil

  # Configure a per-user Flathub remote, but do not auto-install optional apps.
  # The first-run app chooser installs only the apps each user selects.
  - type: default-flatpaks
    configurations:
      - scope: user

  - type: os-release
    properties:
      NAME: "My Custom Distro"
      PRETTY_NAME: "My Custom Distro Gaming Edition"
      VARIANT: "Gaming Edition"
      VARIANT_ID: "gaming"

  - type: signing
