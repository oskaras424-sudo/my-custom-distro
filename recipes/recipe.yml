---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: my-custom-distro
description: "A custom gaming-focused Linux distribution built on Bazzite."

base-image: ghcr.io/ublue-os/bazzite-nvidia-open
image-version: stable

modules:
  # Add our own artwork, launchers, theme and custom applications.
  - type: files
    files:
      - source: system
        destination: /

  # Only the runtime libraries required by our custom Task Manager.
  # KDE desktop tools are provided by the Bazzite KDE base image.
  - type: dnf
    install:
      packages:
        - python3-pyside6
        - python3-psutil

  # Firefox is the only additional application installed by default.
  # Steam and the KDE desktop essentials are provided by the Bazzite base.
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
      # Make Flathub available to users for optional applications they choose.
      - scope: user

  - type: os-release
    properties:
      NAME: "My Custom Distro"
      PRETTY_NAME: "My Custom Distro Gaming Edition"
      VARIANT: "Gaming Edition"
      VARIANT_ID: "gaming"

  - type: signing
